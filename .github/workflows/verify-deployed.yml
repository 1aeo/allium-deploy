name: Verify Deployed Bundle

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-deployed:
    name: Verify Deployed Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Enable pnpm
        run: corepack enable

      - name: Install verifier dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify deployed Pages commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME || '1aeo-metrics' }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::notice::Cloudflare secrets are not configured; skipping deployed-bundle verification."
            exit 0
          fi
          ./scripts/verify-deployed-matches-checkout.sh
