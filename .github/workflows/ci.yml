name: Deploy CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shell-syntax:
    name: Shell Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Bash scripts
        run: |
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
